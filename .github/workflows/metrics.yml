name: Generate Metrics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Leo-T-Zang
          config_timezone: America/New_York
          filename: github-metrics.svg
          
          # Base template - NO achievements
          template: classic
          base: header, activity, community, repositories, metadata
          
          # Repository settings
          repositories_affiliations: owner, collaborator
          repositories_forks: no
          
          # Working plugins only
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_ignored: html, css, jupyter notebook
          plugin_languages_limit: 8
          
          plugin_followup: yes
          
          plugin_notable: yes
          plugin_notable_filter: stars:>5
          plugin_notable_repositories: yes
          
          plugin_stars: yes
          plugin_stars_limit: 4
          
          # EXPLICITLY disable achievements to prevent errors
          plugin_achievements: no
          plugin_achievements_display: no