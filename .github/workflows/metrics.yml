name: Generate Metrics

on:
  schedule:
    - cron: "17 3 * * *"   # daily
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Target
          user: Leo-T-Zang
          config_timezone: America/New_York
          filename: github-metrics.svg

          # Core sections
          template: classic
          base: header, activity, community, repositories, metadata

          # Include stars for repos you own + ones you collaborate on
          repositories_affiliations: owner, collaborator
          repositories_forks: no

          # Useful plugins
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_ignored: html, css

          plugin_followup: yes

          # Highlight contributions to external repos (not a star total, but links/cards)
          plugin_notable: yes
          plugin_notable_filter: >-
            is:public fork:false

          # Remove the plugin that is erroring for you right now
          # plugin_achievements: no
