name: Generate Metrics

on:
  schedule:
    - cron: "17 3 * * *"   # daily
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Target
          user: Leo-T-Zang
          config_timezone: America/New_York
          filename: github-metrics.svg

          # Core sections
          template: classic
          base: header, activity, community, repositories, metadata

          # Include stars for repos you own + ones you collaborate on
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: no

          # Languages plugin
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_ignored: html, css, jupyter notebook
          plugin_languages_limit: 8

          # Followup plugin
          plugin_followup: yes

          # Stars plugin - this will show total stars across all your repos
          plugin_stars: yes
          plugin_stars_limit: 4

          # Achievements plugin (disable if causing errors)
          plugin_achievements: no
          
          # Notable contributions plugin
          plugin_notable: yes
          plugin_notable_filter: stars:>10
          plugin_notable_repositories: yes