name: Update Contribution Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Fetch full history

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Generate contribution stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "
          const https = require('https');
          const fs = require('fs');
          
          const query = JSON.stringify({
            query: \`
              query {
                user(login: \"Leo-T-Zang\") {
                  repositoriesContributedTo(first: 100, includeUserRepositories: true, contributionTypes: [COMMIT, PULL_REQUEST]) {
                    nodes {
                      name
                      owner {
                        login
                      }
                      stargazerCount
                      url
                      description
                      primaryLanguage {
                        name
                      }
                    }
                  }
                }
              }
            \`
          });
          
          const options = {
            hostname: 'api.github.com',
            port: 443,
            path: '/graphql',
            method: 'POST',
            headers: {
              'Authorization': 'Bearer ' + process.env.GITHUB_TOKEN,
              'Content-Type': 'application/json',
              'User-Agent': 'GitHub-Stats-Action'
            }
          };
          
          const req = https.request(options, (res) => {
            let data = '';
            res.on('data', (chunk) => data += chunk);
            res.on('end', () => {
              try {
                const result = JSON.parse(data);
                if (result.errors) {
                  console.error('GraphQL errors:', result.errors);
                  return;
                }
                
                const repos = result.data.user.repositoriesContributedTo.nodes;
                
                // Filter out repos with 0 stars and only include meaningful contributions
                const meaningfulRepos = repos.filter(repo => repo.stargazerCount > 0);
                const totalStars = meaningfulRepos.reduce((sum, repo) => sum + repo.stargazerCount, 0);
                
                meaningfulRepos.sort((a, b) => b.stargazerCount - a.stargazerCount);
                
                let markdown = \`## ⭐ Total Stars from Code Contributions: \${totalStars}\n\n\`;
                markdown += \`*From \${meaningfulRepos.length} repositories with contributions*\n\n\`;
                markdown += \`### Top Contributed Repositories:\n\n\`;
                
                meaningfulRepos.slice(0, 10).forEach(repo => {
                  markdown += \`- [\${repo.owner.login}/\${repo.name}](\${repo.url}) - ⭐ \${repo.stargazerCount} stars\`;
                  if (repo.primaryLanguage) {
                    markdown += \` (\${repo.primaryLanguage.name})\`;
                  }
                  markdown += \`\n\`;
                  if (repo.description) {
                    markdown += \`  - \${repo.description}\n\`;
                  }
                });
                
                const readme = fs.readFileSync('README.md', 'utf8');
                const startMarker = '<!-- CONTRIBUTION-STATS:START -->';
                const endMarker = '<!-- CONTRIBUTION-STATS:END -->';
                
                if (readme.includes(startMarker) && readme.includes(endMarker)) {
                  const newReadme = readme.replace(
                    new RegExp(\`\${startMarker}[\\\\s\\\\S]*\${endMarker}\`),
                    \`\${startMarker}\n\${markdown}\n\${endMarker}\`
                  );
                  fs.writeFileSync('README.md', newReadme);
                  console.log('README updated successfully!');
                } else {
                  console.log('Markers not found in README.md');
                }
              } catch (error) {
                console.error('Error processing response:', error);
              }
            });
          });
          
          req.on('error', (error) => {
            console.error('Request error:', error);
          });
          
          req.write(query);
          req.end();
          "

      - name: Commit and push changes
        run: |
          # Check if there are any changes to commit
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # Stage changes
          git add README.md
          
          # Check if there are staged changes
          if git diff --staged --quiet; then
            echo "No staged changes to commit"
            exit 0
          fi
          
          # Commit changes
          git commit -m "🤖 Update code contribution stats [skip ci]"
          
          # Try to push with retry logic
          MAX_RETRIES=3
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Attempting to push (attempt $((RETRY_COUNT + 1))/$MAX_RETRIES)..."
            
            # Pull latest changes with rebase
            if git pull --rebase origin main; then
              echo "Successfully pulled latest changes"
            else
              echo "Pull failed, but continuing..."
            fi
            
            # Try to push
            if git push origin main; then
              echo "Successfully pushed changes!"
              exit 0
            else
              echo "Push failed, retrying..."
              RETRY_COUNT=$((RETRY_COUNT + 1))
              sleep 2
            fi
          done
          
          echo "Failed to push after $MAX_RETRIES attempts"
          exit 1